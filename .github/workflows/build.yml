name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install pyinstaller pillow pyautogui

      - name: 构建 EXE
        run: pyinstaller --onefile --windowed --name mpcomposer --add-data "screenshots;screenshots" run.py

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpcomposer
          path: dist/mpcomposer.exe

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/mpcomposer.exe
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
